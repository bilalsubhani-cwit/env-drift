name: Secret Scan

# A self-contained secret-hygiene gate — no third-party action, nothing to pin.
# Fails if a real .env file is committed, or if a high-signal secret pattern
# appears in any tracked file. Keeps secrets out of the repository and the
# published package.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: No committed .env files (except .env.example)
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env file(s) found — remove and rotate any exposed values:"
            echo "$tracked"
            exit 1
          fi

      - name: No high-signal secrets in tracked files
        run: |
          # High-signal patterns only, to avoid false positives on docs/tests.
          patterns='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{20,}|glpat-[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}'
          # Exclude this workflow (which necessarily contains the patterns).
          hits=$(git grep -nIE "$patterns" -- . ':!.github/workflows/secret-scan.yml' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible secret(s) detected in tracked files:"
            echo "$hits"
            exit 1
          fi

      - name: Published tarball excludes source and env files
        run: |
          npm pack --dry-run --json > /tmp/pack.json 2>/dev/null
          if grep -qE '"path": *"(src/|tests/|[^"]*\.env)' /tmp/pack.json; then
            echo "::error::npm package would include source or .env files (expected dist/ only):"
            grep -E '"path"' /tmp/pack.json
            exit 1
          fi
